    <div>
      <link href="./navigation.css" rel="stylesheet" />
      <div class="navigation-container1">
        <div class="navigation-container2">
          <div class="navigation-container3">
            <style>
              html {
                scroll-behavior: smooth;
              }
              section[id] {
                scroll-margin-top: 72px;
              }
              @media (max-width: 767px) {
              section[id] {
                scroll-margin-top: 64px;
              }
              }
              @media (max-width: 479px) {
              section[id] {
                scroll-margin-top: 60px;
              }
              }
            </style>
          </div>
        </div>
        <div class="navigation-container4">
          <div class="navigation-container5">
            <script defer="" data-name="navigation">
              (function(){
                const navigationToggle = document.getElementById('navigation-toggle')
                const navigationMenu = document.getElementById('navigation-menu')

                if (navigationToggle && navigationMenu) {
                  navigationToggle.addEventListener('click', function () {
                    const isOpen = navigationMenu.classList.contains('navigation-menu-open')

                    if (isOpen) {
                      navigationMenu.classList.remove('navigation-menu-open')
                      navigationToggle.setAttribute('aria-expanded', 'false')
                    } else {
                      navigationMenu.classList.add('navigation-menu-open')
                      navigationToggle.setAttribute('aria-expanded', 'true')
                    }
                  })

                  // Close mobile menu when clicking on navigation links
                  const navigationLinks = navigationMenu.querySelectorAll('.navigation-link')
                  navigationLinks.forEach((link) => {
                    link.addEventListener('click', function () {
                      navigationMenu.classList.remove('navigation-menu-open')
                      navigationToggle.setAttribute('aria-expanded', 'false')
                    })
                  })

                  // Close mobile menu when clicking outside
                  document.addEventListener('click', function (event) {
                    const isClickInsideNav =
                      navigationToggle.contains(event.target) ||
                      navigationMenu.contains(event.target)

                    if (
                      !isClickInsideNav &&
                      navigationMenu.classList.contains('navigation-menu-open')
                    ) {
                      navigationMenu.classList.remove('navigation-menu-open')
                      navigationToggle.setAttribute('aria-expanded', 'false')
                    }
                  })

                  // Handle escape key to close mobile menu
                  document.addEventListener('keydown', function (event) {
                    if (
                      event.key === 'Escape' &&
                      navigationMenu.classList.contains('navigation-menu-open')
                    ) {
                      navigationMenu.classList.remove('navigation-menu-open')
                      navigationToggle.setAttribute('aria-expanded', 'false')
                      navigationToggle.focus()
                    }
                  })
                }
              })()
            </script>
          </div>
        </div>

            <div id="navigation-menu" class="navigation-menu">
